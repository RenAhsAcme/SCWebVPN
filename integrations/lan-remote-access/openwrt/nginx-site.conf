map $http_upgrade $lan_remote_connection {
    default upgrade;
    ''      close;
}

server {
    listen 127.0.0.1:18081;
    server_name _;

    root /opt/lan-remote-access/www;
    index index.html;
    client_max_body_size 256m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = / {
        return 302 /rdp/;
    }

    location = /rdp {
        return 308 /rdp/;
    }

    location ^~ /rdp/ {
        try_files $uri $uri/ /rdp/index.html;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    }

    location = /guacamole {
        return 308 /guacamole/;
    }

    location ^~ /guacamole/ {
        proxy_pass http://127.0.0.1:8080/guacamole/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $lan_remote_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-WebVPN-User webvpn;
    }

    location = /files {
        return 308 /files/;
    }

    location ^~ /files/ {
        __FILE_PROXY_PASS__
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-WebVPN-User webvpn;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        client_max_body_size 0;
    }

    location = /web/ {
        try_files /web/index.html =404;
        add_header Cache-Control "no-store" always;
    }

    location = /web/index.html {
        try_files /web/index.html =404;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /web/ {
        try_files $uri $uri/ =404;
    }

    location = /ws/id {
        proxy_pass http://127.0.0.1:21118;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location = /ws/relay {
        proxy_pass http://127.0.0.1:21119;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
